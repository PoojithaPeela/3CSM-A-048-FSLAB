<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ANITS - Central Placement Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <h1 class="portal-title">ANITS - Central Placement Portal</h1>

    <div class="login-box">
      <h2>User Login</h2>

      <form id="loginForm" onsubmit="return validateLogin()">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter Username">
        <span class="error" id="userError"></span>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password">
        <span class="error" id="passError"></span>

        <button type="submit">Login</button>
      </form>
    </div>
  </div>

<script>
function validateLogin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const userError = document.getElementById("userError");
  const passError = document.getElementById("passError");

  userError.textContent = "";
  passError.textContent = "";
  let valid = true;

  if (username === "") {
    userError.textContent = "Username is required";
    valid = false;
  }

  if (password === "") {
    passError.textContent = "Password is required";
    valid = false;
  }

  // Demo only: redirects on any non-empty username/password.
  // Replace this block with a real authentication check when you have a backend.
  if (valid) {
    window.location.href = "success.html";
  }

  return false; // prevent actual form submission
}
</script>

</body>
</html>
